[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "individuation-mcmc"
version = "0.1.0"
description = "Hierarchical Bayesian inference of per-person decision parameters and learning rules (DDM-reduction route), for individuation and manipulability prediction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "numpyro>=0.15",
    "jax>=0.4.28",
    "arviz>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["individuation_mcmc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
