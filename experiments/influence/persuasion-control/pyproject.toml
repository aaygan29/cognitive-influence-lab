[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persuasion-control"
version = "0.1.0"
description = "In-silico measurement of covert AI persuasion against a human-control decision, built on the bellwether value-decision circuit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # The bellwether value-decision circuit and monitor. Installed from the
    # sibling experiment folder; see README for the editable-install command.
    "bellwether>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["persuasion_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
