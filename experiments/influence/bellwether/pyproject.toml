[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bellwether"
version = "0.1.0"
description = "An early-warning instrument for value-decision capture in an attractor decision circuit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["bellwether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
