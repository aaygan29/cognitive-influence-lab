[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeprint"
version = "0.0.1"
description = "Behaviorally-validated instrument for measuring choice distortion from content."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aayush Gandhi" }]
keywords = ["neuroeconomics", "choice", "validation", "spiking-neural-networks", "decision-making"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
stats = ["scipy>=1.10", "scikit-learn>=1.3", "statsmodels>=0.14", "pandas>=2.0"]
fmri = ["nilearn>=0.10", "nibabel>=5"]
# Optional, opt-in extras (separate repos / heavy deps):
#   csi      -> neurosignal (CSI engine), editable-install from ../../../Sapient/neurosignal
#   spiking  -> snntorch + torch (spiking decision model + energy benchmark)

[tool.setuptools.packages.find]
include = ["spikeprint*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
