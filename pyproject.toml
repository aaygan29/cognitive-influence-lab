[project]
name = "loyalty-audit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "tqdm",
  "pyyaml",
]

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.44", "peft", "safetensors", "matplotlib", "modal"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/loyalty_audit/audit", "src/loyalty_audit/detectors", "src/loyalty_audit/organisms"]
